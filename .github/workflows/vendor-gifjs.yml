name: Vendor gif.js
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-gifjs.yml'
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download gif.js 0.2.0 distribution files
        run: |
          curl -fsSL https://raw.githubusercontent.com/jnordberg/gif.js/master/dist/gif.js -o gif.js
          curl -fsSL https://raw.githubusercontent.com/jnordberg/gif.js/master/dist/gif.worker.js -o gif.worker.js
          grep -q "gif.js 0.2.0" gif.js
          grep -q "gif.worker.js 0.2.0" gif.worker.js
      - name: Commit vendored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gif.js gif.worker.js
          git diff --cached --quiet || git commit -m "Vendor gif.js 0.2.0 locally"
          git push
