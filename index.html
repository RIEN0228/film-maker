<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FILM MAKER</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171513;color:#eee;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:1180px;margin:0 auto;padding:34px 24px}h1{font:800 25px Georgia,serif;letter-spacing:5px;margin:0 0 25px}.layout{display:grid;grid-template-columns:minmax(0,760px) 330px;gap:28px}.stage{background:#0b0a09;border:1px solid #3a3630;padding:18px;box-shadow:0 18px 60px #0008}canvas{width:100%;display:block;background:transparent}.side{background:#211e1a;border:1px solid #403b34;padding:19px}.g{border-bottom:1px solid #403b34;padding:0 0 17px;margin:0 0 17px}.g:last-child{border:0}.t{font-weight:800;font-size:13px;letter-spacing:1px;margin-bottom:12px}.s{font-size:12px;color:#aaa;margin:7px 0}.drop{height:110px;border:1px dashed #746d61;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;color:#bbb;font-size:13px}.drop:hover{border-color:#ddd;color:#fff}input[type=range]{width:100%;accent-color:#c9b99a}input[type=date],textarea{width:100%;background:#151310;color:#eee;border:1px solid #4a443b;padding:9px}textarea{height:70px;resize:vertical}label{display:block;font-size:12px;margin:8px 0;color:#d3cec6}button{width:100%;padding:13px;background:#eee4d2;border:0;color:#171513;font-weight:900;cursor:pointer;letter-spacing:1px}button:disabled{opacity:.35}.status{font-size:11px;color:#aaa;text-align:center;margin-top:9px}@media(max-width:900px){.layout{grid-template-columns:1fr}}
</style>
</head><body><div class="wrap"><h1>FILM MAKER</h1><div class="layout"><div class="stage"><canvas id="c" width="720" height="500"></canvas></div><div class="side">
<div class="g"><div class="t">사진</div><div class="drop" id="drop">사진 한 장을 올려주세요<br>클릭 · 드래그 · 붙여넣기</div><input id="file" type="file" accept="image/*" hidden></div>
<div class="g"><div class="t">필름 움직임</div><div class="s">속도</div><input id="speed" type="range" min=".65" max="1.7" step=".05" value="1"><div class="s">지지직 강도</div><input id="jit" type="range" min=".45" max="1.4" step=".05" value="1"><div class="s">필름 그레인</div><input id="grain" type="range" min="0" max=".6" step=".05" value=".10"><div class="s">비네트</div><input id="vignette" type="range" min="0" max="1" step=".05" value=".45"></div>
<div class="g"><div class="t">날짜</div><input id="date" type="date"><label><input id="showDate" type="checkbox" checked> 날짜 표시</label></div>
<div class="g"><div class="t">영화 대사</div><textarea id="quote" maxlength="90" placeholder="예: 우리에게는 아직, 장면이 남아 있어."></textarea><label><input id="showQuote" type="checkbox" checked> 대사 표시</label></div>
<div class="g"><label><input id="flash" type="checkbox" checked> 중앙에 멈출 때 짧은 플래시</label><label><input id="scan" type="checkbox" checked> 스캔라인</label></div>
<div class="g"><div class="t">GIF 저장 설정</div>
<label><input type="radio" name="fps" value="30" checked> 고화질 · 30fps</label>
<label><input type="radio" name="fps" value="20"> 용량 절약 · 20fps</label>
<div class="s" style="margin-top:10px">저장 크기</div>
<label><input type="radio" name="outsize" value="720" checked> 기본 · 720 × 500</label>
<label><input type="radio" name="outsize" value="504"> 작은 사이즈 · 504 × 350</label>
</div>
<button id="save" disabled>GIF 만들기</button><div class="status" id="status"></div>
</div></div></div>
<script src="./gif.js"></script>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),file=document.querySelector('#file'),drop=document.querySelector('#drop'),speed=document.querySelector('#speed'),jit=document.querySelector('#jit'),grain=document.querySelector('#grain'),vignette=document.querySelector('#vignette'),date=document.querySelector('#date'),showDate=document.querySelector('#showDate'),quote=document.querySelector('#quote'),showQuote=document.querySelector('#showQuote'),flash=document.querySelector('#flash'),scan=document.querySelector('#scan'),save=document.querySelector('#save'),status=document.querySelector('#status');let img=null,start=performance.now();date.value=new Date().toISOString().slice(0,10);
function load(f){if(!f||!f.type.startsWith('image/'))return;let u=URL.createObjectURL(f),im=new Image;im.onload=()=>{img=im;URL.revokeObjectURL(u);drop.textContent=f.name;save.disabled=false};im.src=u}drop.onclick=()=>file.click();file.onchange=e=>load(e.target.files[0]);['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault()}));drop.addEventListener('drop',e=>{e.preventDefault();load(e.dataTransfer.files[0])});addEventListener('paste',e=>{for(let a of e.clipboardData.items)if(a.type.startsWith('image/')){load(a.getAsFile());break}});
function rnd(n){let z=Math.sin(n*12.9898)*43758.5453;return z-Math.floor(z)}
function cover(im,dx,dy,dw,dh){let r=Math.max(dw/im.width,dh/im.height),w=im.width*r,h=im.height*r;x.drawImage(im,dx+(dw-w)/2,dy+(dh-h)/2,w,h)}
function holes(y){x.save();x.globalCompositeOperation='destination-out';for(let yy=y+20;yy<y+480;yy+=34){for(let xx of [28,664]){x.beginPath();x.roundRect(xx,yy,28,18,4);x.fill()}}x.restore()}
function oneFilm(y,seed){x.save();x.fillStyle='#090806';x.fillRect(0,y,720,500);if(img){x.save();x.beginPath();x.rect(68,y+48,584,404);x.clip();cover(img,68,y+48,584,404);x.restore()}
 x.fillStyle='#d8cdb7';x.font='10px monospace';x.fillText('FILM 400',75,y+30);x.fillText('36',620,y+30);x.fillText('◀ 08',585,y+482);
 if(img&&showDate.checked&&date.value){let d=date.value.replaceAll('-','.');x.font='14px monospace';x.textAlign='right';x.fillStyle='#f4d890';x.fillText(d,632,y+75);x.textAlign='left'}
 if(img&&showQuote.checked&&quote.value.trim()){let words=quote.value.trim().split(/\s+/),lines=[''];for(let w of words){let i=lines.length-1,t=(lines[i]+' '+w).trim();x.font='italic 19px "Gulim","굴림","Arial Rounded MT Bold","Noto Sans KR",sans-serif';if(x.measureText(t).width>500&&lines[i])lines.push(w);else lines[i]=t;if(lines.length>2){lines[1]+='…';break}}x.textAlign='center';x.lineWidth=3;x.strokeStyle='#000c';x.fillStyle='#fff';let base=y+423-(lines.length-1)*12;lines.slice(0,2).forEach((l,i)=>{x.strokeText(l,360,base+i*25);x.fillText(l,360,base+i*25)});x.textAlign='left'}
 let vg=+vignette.value;if(vg>0){let gr=x.createRadialGradient(360,y+250,95,360,y+250,365);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.55,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,'+(vg*.72)+')');x.fillStyle=gr;x.fillRect(68,y+48,584,404)}
 let g=+grain.value;if(g>0){x.globalAlpha=g*.34;for(let i=0;i<1500;i++){let q=rnd(seed*1700+i),xx=68+rnd(seed*2500+i*3)*584,yy=y+48+rnd(seed*3300+i*5)*404;x.fillStyle=q>.5?'#fff':'#000';x.fillRect(xx,yy,1,1)}x.globalAlpha=1}holes(y);x.restore()}
function draw(ms){x.clearRect(0,0,720,500);let moveD=1225/+speed.value,holdD=1500,d=moveD+holdD,t=ms%d,p=t/moveD,J=+jit.value,off=0;
  // Speed affects only the rolling/jitter phase. The centered hold is always 1.5 seconds.
  if(t<moveD){
    if(p<.20)off=150*J;
    else if(p<.36)off=-95*J;
    else if(p<.54)off=82*J;
    else if(p<.70)off=-190*J;
    else if(p<.86)off=60*J;
    else off=((1-p)/.14)*30*J;
  } else off=(rnd(Math.floor(ms/90))-.5)*2;
 let seed=Math.floor(ms/55);for(let k=-2;k<=2;k++)oneFilm(off+k*500,seed+k*11);
 if(scan.checked&&img){let sy=((ms*.18)%404)+48;x.fillStyle='rgba(255,255,255,.11)';x.fillRect(68,sy,584,2)}
 if(flash.checked&&t>=moveD&&t<moveD+135){let fp=(t-moveD)/135,z=1-Math.abs(fp-.5)/.5;x.fillStyle='rgba(255,250,235,'+(Math.max(0,z)*.22)+')';x.fillRect(68,48,584,404)}
}
function loop(now){draw(now-start);requestAnimationFrame(loop)}requestAnimationFrame(loop);
save.onclick=async()=>{if(!img)return;save.disabled=true;status.textContent='GIF 준비 중…';
 let workerURL='./gif.worker.js';
 const fps=Number(document.querySelector('input[name="fps"]:checked').value);
 const outW=Number(document.querySelector('input[name="outsize"]:checked').value);
 const outH=Math.round(outW*500/720);
 const gif=new GIF({workers:2,quality:1,width:outW,height:outH,transparent:0xFF00FF,dither:false,workerScript:workerURL});
 let d=1225/+speed.value+1500,N=Math.max(1,Math.round(d/1000*fps));
 for(let i=0;i<N;i++){
   draw(i/N*d);
   let temp=document.createElement('canvas');temp.width=outW;temp.height=outH;let tx=temp.getContext('2d');
   tx.imageSmoothingEnabled=true;tx.imageSmoothingQuality='high';
   tx.clearRect(0,0,outW,outH);tx.drawImage(c,0,0,outW,outH);
   let im=tx.getImageData(0,0,outW,outH),p=im.data;
   for(let q=0;q<p.length;q+=4){
     if(p[q+3]<245){p[q]=255;p[q+1]=0;p[q+2]=255;p[q+3]=255}
     else p[q+3]=255;
   }
   tx.putImageData(im,0,0);
   gif.addFrame(tx,{copy:true,delay:Math.round(1000/fps)});
 }
 gif.on('progress',p=>status.textContent='GIF 만드는 중… '+Math.round(p*100)+'%');
 gif.on('finished',b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='film.gif';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);status.textContent='완성!';save.disabled=false});
 gif.on('error',e=>{console.error(e);status.textContent='GIF 생성 오류: '+(e?.message||e);save.disabled=false});
 gif.on('abort',()=>{status.textContent='GIF 생성이 중단됐어요.';save.disabled=false});
 try{gif.render()}catch(e){console.error(e);status.textContent='GIF 생성 오류: '+e.message;save.disabled=false}
};
</script></body></html>
