<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FILM MAKER</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171513;color:#eee;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:1180px;margin:0 auto;padding:34px 24px 55px}h1{font:800 25px Georgia,"Times New Roman",serif;letter-spacing:5px;margin:0 0 25px;color:#f4eee5}.layout{display:grid;grid-template-columns:minmax(0,760px) 330px;gap:28px}.preview{background:#35312c;border:1px solid #4a443c;padding:18px;min-height:540px;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 60px #0008}.canvas-wrap{width:100%;background:repeating-conic-gradient(#5a5650 0 25%,#77726b 0 50%) 50%/18px 18px;padding:12px}.panel{background:#211e1a;border:1px solid #403b34;padding:19px}.g{border-bottom:1px solid #403b34;padding:0 0 17px;margin:0 0 17px}.g:last-of-type{border:0}.t{font-weight:800;font-size:13px;letter-spacing:1px;margin-bottom:12px}.s{font-size:12px;color:#aaa;margin:7px 0;display:block}.drop{height:110px;border:1px dashed #746d61;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;color:#bbb;font-size:13px;overflow:hidden;background:#181613}.drop:hover{border-color:#ddd;color:#fff}.drop img{width:100%;height:100%;object-fit:contain;display:none}input[type=range]{width:100%;accent-color:#c9b99a}input[type=date],textarea{width:100%;background:#151310;color:#eee;border:1px solid #4a443b;padding:9px;font:inherit}textarea{height:70px;resize:vertical;line-height:1.45}label{display:block;font-size:12px;margin:8px 0;color:#d3cec6}button{width:100%;padding:13px;background:#eee4d2;border:0;color:#171513;font-weight:900;cursor:pointer;letter-spacing:1px}button:disabled{opacity:.35}.status{font-size:11px;color:#aaa;text-align:center;margin-top:9px}canvas{width:100%;display:block;background:transparent}@media(max-width:900px){.layout{grid-template-columns:1fr}.preview{min-height:auto}}
</style></head><body>
<div class="wrap"><h1>FILM MAKER</h1><div class="layout"><section class="preview"><div class="canvas-wrap"><canvas id="c" width="720" height="500"></canvas></div></section><section class="panel">
<div class="g"><div class="t">사진</div><div class="drop" id="drop"><div id="dt">사진 한 장을 올려주세요<br>클릭 · 드래그</div><img id="thumb"></div><input id="file" type="file" accept="image/*" hidden></div><div class="g"><div class="t">필름 움직임</div><span class="s">속도</span><input id="speed" type="range" min=".75" max="1.35" step=".05" value="1"><span class="s">지지직 강도</span><input id="jit" type="range" min=".5" max="1.5" step=".05" value="1"><span class="s">필름 그레인</span><input id="grain" type="range" min="0" max=".6" step=".05" value=".10"><span class="s">비네트</span><input id="vignette" type="range" min="0" max="1" step=".05" value=".45"></div><div class="g"><div class="t">날짜</div><input id="date" type="date"><label><input id="showDate" type="checkbox" checked> 날짜 표시</label></div><div class="g"><div class="t">영화 대사</div><textarea id="quote" maxlength="80" placeholder="사진에 넣을 문구를 작성해 주세요."></textarea><span class="s">최대 두 줄로 표시됩니다.</span><label><input id="showQuote" type="checkbox" checked> 문구 표시</label></div><div class="g"><label><input id="flash" type="checkbox" checked> 중앙에 멈출 때 짧은 플래시</label><label><input id="scan" type="checkbox" checked> 스캔라인</label></div><div class="g"><div class="t">GIF 저장 설정</div><label><input type="radio" name="fps" value="30" checked> 고화질 · 30fps</label><label><input type="radio" name="fps" value="20"> 용량 절약 · 20fps</label><span class="s" style="margin-top:10px">저장 크기</span><label><input type="radio" name="outsize" value="720" checked> 기본 · 720 × 500</label><label><input type="radio" name="outsize" value="504"> 작은 사이즈 · 504 × 350</label></div><button id="save" disabled>GIF 만들기</button><div class="status" id="status"></div></section></div></div>
<script src="./gif.js"></script><script>
const $=s=>document.querySelector(s),c=$('#c'),x=c.getContext('2d'),file=$('#file'),drop=$('#drop'),thumb=$('#thumb'),dt=$('#dt'),speed=$('#speed'),jit=$('#jit'),grain=$('#grain'),vignette=$('#vignette'),date=$('#date'),showDate=$('#showDate'),quote=$('#quote'),showQuote=$('#showQuote'),flash=$('#flash'),scan=$('#scan'),save=$('#save'),status=$('#status');let img=null,start=performance.now();date.value=new Date().toISOString().slice(0,10);drop.onclick=()=>file.click();drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])};file.onchange=()=>file.files[0]&&load(file.files[0]);function load(f){let u=URL.createObjectURL(f),z=new Image();z.onload=()=>{img=z;thumb.src=u;thumb.style.display='block';dt.style.display='none';save.disabled=false};z.src=u}function rr(cx,cy,w,h,r){x.beginPath();x.roundRect(cx,cy,w,h,r);x.fill()}function rnd(n){return((Math.sin(n*12.9898)*43758.5453)%1+1)%1}function cover(px,py,w,h){let s=Math.max(w/img.width,h/img.height),sw=w/s,sh=h/s;x.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,px,py,w,h)}function wrap(text,max){let a=[''];for(let ch of[...text]){let i=a.length-1,t=a[i]+ch;if(x.measureText(t).width>max&&a[i]){if(a.length===2)break;a.push(ch)}else a[i]=t}return a}
function oneFilm(y,ms,active){x.save();x.translate(0,y);x.fillStyle='#0b0b0b';x.fillRect(0,0,720,500);x.save();x.globalCompositeOperation='destination-out';x.fillStyle='#000';for(let yy=18;yy<490;yy+=58){rr(19,yy,30,34,5);rr(671,yy,30,34,5)}x.restore();if(img){x.save();x.beginPath();x.rect(68,48,584,404);x.clip();cover(68,48,584,404);x.restore()}else{x.fillStyle='#202020';x.fillRect(68,48,584,404)}let va=+vignette.value;if(va>0){let g=x.createRadialGradient(360,245,120,360,245,355);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.55,'rgba(0,0,0,'+(va*.08)+')');g.addColorStop(1,'rgba(0,0,0,'+(va*.72)+')');x.fillStyle=g;x.fillRect(68,48,584,404)}x.fillStyle='#caa064';x.font='12px monospace';x.textAlign='left';x.fillText('FILM 400',70,26);x.fillText('36',620,26);x.fillText('◀ 08',70,484);if(active){let a=+grain.value;x.save();for(let i=0;i<Math.floor(360*a);i++){x.globalAlpha=.05+a*.08;x.fillStyle=i%2?'#fff':'#000';x.fillRect(68+rnd(i+ms*.01)*584,48+rnd(i*3+ms*.02)*404,1+(i%2),1+(i%2))}if(scan.checked){x.globalAlpha=.10;x.fillStyle='#fff';let sy=48+(ms*.2)%404;x.fillRect(68,sy,584,1)}x.restore();if(showQuote.checked&&quote.value.trim()){x.save();x.font='italic 19px "Gulim","굴림","Arial Rounded MT Bold","Noto Sans KR",sans-serif';x.textAlign='center';let lines=wrap(quote.value.trim(),500),base=423-(lines.length-1)*12;x.lineWidth=3;x.strokeStyle='rgba(0,0,0,.72)';x.fillStyle='#fff';lines.forEach((t,i)=>{let yy=base+i*25;x.strokeText(t,360,yy);x.fillText(t,360,yy)});x.restore()}if(showDate.checked&&date.value){x.fillStyle='#f0a05c';x.font='15px monospace';x.textAlign='right';x.fillText(date.value.replaceAll('-','.'),635,438);x.textAlign='left'}}x.restore()}
function draw(ms){x.clearRect(0,0,720,500);if(!img){oneFilm(0,ms,true);x.fillStyle='#ddd';x.textAlign='center';x.font='bold 22px Arial';x.fillText('사진 한 장을 넣어주세요',360,250);x.textAlign='left';return}let moveD=1225/+speed.value,holdD=1500,d=moveD+holdD,t=ms%d,p=t/moveD,J=+jit.value,off=0;if(t<moveD){if(p<.20)off=150*J;else if(p<.36)off=-95*J;else if(p<.54)off=82*J;else if(p<.70)off=-190*J;else if(p<.86)off=60*J;else off=((1-p)/.14)*30*J}else off=(rnd(Math.floor(ms/90))-.5)*2;oneFilm(off-500,ms,false);oneFilm(off,ms,true);oneFilm(off+500,ms,false);if(flash.checked&&t>=moveD&&t<moveD+135){let fp=(t-moveD)/135,z=1-Math.abs(fp-.5)/.5;x.fillStyle='rgba(255,250,235,'+(Math.max(0,z)*.22)+')';x.fillRect(68,48,584,404)}}function loop(t){draw(t-start);requestAnimationFrame(loop)}requestAnimationFrame(loop);
save.onclick=async()=>{if(!img)return;save.disabled=true;status.textContent='GIF 만드는 중…';const fps=Number(document.querySelector('input[name="fps"]:checked').value),outW=Number(document.querySelector('input[name="outsize"]:checked').value),outH=Math.round(outW*500/720),gif=new GIF({workers:2,quality:1,width:outW,height:outH,transparent:0xFF00FF,dither:false,workerScript:'./gif.worker.js'});let d=1225/+speed.value+1500,N=Math.max(1,Math.round(d/1000*fps));for(let i=0;i<N;i++){draw(i/N*d);let temp=document.createElement('canvas');temp.width=outW;temp.height=outH;let tx=temp.getContext('2d');tx.imageSmoothingEnabled=true;tx.imageSmoothingQuality='high';tx.clearRect(0,0,outW,outH);tx.drawImage(c,0,0,outW,outH);let im=tx.getImageData(0,0,outW,outH),p=im.data;for(let q=0;q<p.length;q+=4){if(p[q+3]<245){p[q]=255;p[q+1]=0;p[q+2]=255;p[q+3]=255}else p[q+3]=255}tx.putImageData(im,0,0);gif.addFrame(tx,{copy:true,delay:Math.round(1000/fps)})}gif.on('finished',b=>{let url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='film-maker.gif';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);status.textContent='완성!';save.disabled=false});gif.on('progress',p=>status.textContent='GIF 만드는 중… '+Math.round(p*100)+'%');gif.on('abort',()=>{status.textContent='GIF 생성이 중단됐어요.';save.disabled=false});try{gif.render()}catch(e){console.error(e);status.textContent='GIF 생성 오류: '+e.message;save.disabled=false}};
</script></body></html>
