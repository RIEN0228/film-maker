<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIEN MAKER</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#171513;color:#eee;font-family:Arial,"Noto Sans KR",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
.topbar{
 height:58px;flex:0 0 58px;background:#171513;border-bottom:1px solid #403b34;
 display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:10
}
.brand{font:800 18px Georgia,"Times New Roman",serif;letter-spacing:5px;color:#f4eee5}
.nav{display:flex;height:100%;align-items:stretch;gap:8px}
.nav button{
 position:relative;width:auto;min-width:100px;padding:0 18px;border:0;background:transparent;
 color:#918b82;font:800 12px Arial,sans-serif;letter-spacing:1.7px;cursor:pointer
}
.nav button:hover{color:#e9e1d5}
.nav button.on{color:#f4eee5}
.nav button.on:after{
 content:"";position:absolute;left:18px;right:18px;bottom:0;height:2px;background:#eee4d2
}
.stage{position:relative;flex:1;min-height:0;background:#171513}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#171513}
@media(max-width:600px){
 .topbar{height:54px;flex-basis:54px;padding:0 14px}
 .brand{font-size:15px;letter-spacing:3px}
 .nav{gap:0}.nav button{min-width:auto;padding:0 11px;font-size:11px}
 .nav button.on:after{left:10px;right:10px}
}
</style>
</head>
<body>
<header class="topbar">
 <div class="brand">RIEN MAKER</div>
 <nav class="nav" aria-label="Maker category">
  <button class="on" data-page="film">FILM</button>
  <button data-page="ticket">TICKET</button>
 </nav>
</header>
<main class="stage">
 <iframe id="tool" title="Maker tool" src="./film/index.html"></iframe>
</main>
<script>
const tool=document.querySelector('#tool');
const buttons=[...document.querySelectorAll('[data-page]')];
const pages={
 film:'./film/index.html',
 ticket:'./ticket/index.html'
};
function openMaker(name){
 buttons.forEach(b=>b.classList.toggle('on',b.dataset.page===name));
 tool.src=pages[name];
 history.replaceState(null,'','#'+name);
}
buttons.forEach(b=>b.onclick=()=>openMaker(b.dataset.page));
const first=location.hash==='#ticket'?'ticket':'film';
if(first!=='film')openMaker(first);
</script>
</body>
</html>
